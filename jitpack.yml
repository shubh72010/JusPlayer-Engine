# JitPack build configuration (https://jitpack.io/docs/BUILDING/).
#
# Two gotchas this file handles:
#   1. The build needs JDK 11-21; JitPack's default may be newer (Gradle 8.10 /
#      Kotlin 2.0.21 fail on JDK 25 with a cryptic "25.0.4" daemon error).
#   2. `engine-provider-newpipe` resolves `net.newpipe:extractor:v0.26.4` from
#      `mavenLocal()`, but JitPack builds in a clean environment without it. So we
#      clone + install the exact extractor tag locally before building the project.
jdk:
  - openjdk21

before_install:
  # Clone + install the extractor in a subshell so the `cd` does not leak into
  # the `install` step (JitPack runs every command in the same shell — the old
  # `cd` made `install` run `publishToMavenLocal` inside NewPipeExtractor,
  # so our project was never built and only an empty root jar was published).
  - git clone --depth 1 --branch v0.26.4 https://github.com/TeamNewPipe/NewPipeExtractor.git
  - (cd NewPipeExtractor && ./gradlew publishToMavenLocal --no-daemon)

install:
  - cd /home/jitpack/build && ./gradlew publishToMavenLocal --no-daemon